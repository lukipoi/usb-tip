[package]
name = "usb-tip"
version = "0.1.0"
edition = "2021"
description = "USB 插拔提示器 - 插入/拔出 USB 设备时在右下角弹出识别卡片"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
] }
tray-icon = "0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
